[package]
name = "cista-core"
version = "0.1.1"
edition = "2021"
description = "Core library for Cista, a local, encrypted password manager"
license = "MIT"
repository = "https://github.com/zhezter/cista/cista-core"
keywords = ["security", "cryptography", "argon2", "secret"]
categories = ["cryptography", "security", "authentication"]

[dependencies]
secrecy = { version = "0.8", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["serde-well-known"] }
thiserror = "1"
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tempfile = "3"
rand = "0.8"
dirs = "6"
toml = "0.8"
blake2 = "0.10"
