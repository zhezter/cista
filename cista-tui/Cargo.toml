[package]
name = "cista-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for Cista, a local, encrypted password manager"
license = "MIT"
repository = "https://github.com/zhezter/cista"
keywords = ["vault", "tui", "terminal", "security"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
cista-core = { version = "0.1.0", path = "../cista-core" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
anyhow = "1.0"
secrecy = "0.8"
zeroize = "1.8"
time = "0.3"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
arboard = "3"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-width = "0.1"
